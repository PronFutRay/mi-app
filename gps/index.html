<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>NavPro GPS</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --card2:#334155; --txt:#f1f5f9; --mut:#94a3b8; --acc:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #map { position:fixed; inset:0; background:#cbd5e1; }
  body.dark .leaflet-tile-pane { filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); }
  .ui { position:fixed; left:0; right:0; z-index:500; pointer-events:none; padding:0 10px; }
  .ui > * { pointer-events:auto; }
  #top { top:calc(8px + env(safe-area-inset-top)); display:flex; flex-direction:column; gap:8px; }
  #bottom { bottom:calc(8px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; }
  .card { background:rgba(15,23,42,.94); border:1px solid #334155; border-radius:16px; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  #searchRow { display:flex; gap:8px; }
  #q { flex:1; min-width:0; background:rgba(15,23,42,.94); color:var(--txt); border:1px solid #334155; border-radius:14px; padding:13px 14px; font-size:16px; outline:none; }
  .ibtn { width:48px; height:48px; flex:none; border-radius:14px; border:1px solid #334155; background:rgba(15,23,42,.94); color:var(--txt); font-size:20px; display:flex; align-items:center; justify-content:center; }
  .ibtn:active { background:var(--card2); }
  #results { max-height:40vh; overflow:auto; }
  .res { padding:12px 14px; border-bottom:1px solid #334155; font-size:14px; }
  .res:last-child { border:0; } .res small { color:var(--mut); display:block; margin-top:2px; }
  #banner { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#14532d; border-color:#166534; }
  #banner .ico { font-size:38px; width:50px; text-align:center; line-height:1; }
  #banner .d { font-size:26px; font-weight:800; line-height:1.1; }
  #banner .t { font-size:15px; opacity:.95; }
  #toast { display:flex; align-items:center; gap:12px; padding:12px 14px; font-weight:700; font-size:18px; border-width:2px; }
  #toast .ico { font-size:34px; }
  #toast.info { border-color:var(--acc); } #toast.warn { border-color:var(--warn); background:rgba(69,26,3,.96); }
  #toast.danger { border-color:var(--bad); background:rgba(69,10,10,.97); animation:pulse .8s ease-in-out 3; }
  @keyframes pulse { 50% { transform:scale(1.03); } }
  .hidden { display:none !important; }
  #hud { display:flex; align-items:center; gap:12px; padding:10px 14px; }
  #spd { text-align:center; min-width:74px; } #spd b { font-size:42px; line-height:1; display:block; } #spd small { color:var(--mut); font-size:12px; }
  #spd.over b { color:var(--bad); }
  #lim { width:58px; height:58px; border-radius:50%; background:#fff; color:#111; border:6px solid var(--bad); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; flex:none; }
  #lim.est { border-style:dashed; opacity:.85; }
  #info { flex:1; min-width:0; font-size:14px; } #info .big { font-size:20px; font-weight:700; }
  #info .road { color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #poi { align-self:flex-start; padding:7px 12px; font-size:14px; font-weight:600; }
  .btn { border:0; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:700; color:#fff; background:var(--card2); }
  .btn.pri { background:#0284c7; } .btn.ok { background:#16a34a; } .btn.bad { background:#b91c1c; }
  #routes { padding:12px; display:flex; flex-direction:column; gap:10px; }
  .rcard { padding:10px 12px; border:2px solid #334155; border-radius:12px; display:flex; justify-content:space-between; align-items:center; }
  .rcard.sel { border-color:var(--acc); background:rgba(14,116,144,.25); }
  .rcard b { font-size:20px; } .rcard span { color:var(--mut); }
  .row { display:flex; gap:8px; } .row .btn { flex:1; }
  #side { position:fixed; right:10px; top:50%; transform:translateY(-50%); z-index:500; display:flex; flex-direction:column; gap:8px; }
  #modal { position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.65); display:flex; align-items:flex-end; justify-content:center; }
  #sheet { width:100%; max-width:520px; max-height:88vh; overflow:auto; background:var(--card); border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); }
  #sheet h2 { margin:0 0 10px; } #sheet h3 { margin:16px 0 6px; font-size:13px; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; }
  label.sw { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid #334155; font-size:16px; }
  label.sw input { width:22px; height:22px; accent-color:var(--acc); }
  select { background:var(--card2); color:var(--txt); border:0; border-radius:8px; padding:8px; font-size:16px; }
  .note { font-size:12px; color:var(--mut); line-height:1.45; margin-top:12px; }
  .me { width:34px; height:34px; } .me div { width:34px; height:34px; transition:transform .3s linear; }
  .me svg { width:34px; height:34px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .poi-ico { font-size:22px; text-align:center; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .simtag { position:fixed; left:10px; top:50%; z-index:500; background:var(--warn); color:#000; font-weight:800; padding:4px 10px; border-radius:10px; font-size:12px; }
</style>
</head>
<body class="dark">
<div id="map"></div>

<div id="top" class="ui">
  <div id="searchRow">
    <input id="q" type="search" placeholder="¿A dónde vamos? (calle, ciudad, lugar)" enterkeyhint="search" autocomplete="off">
    <button class="ibtn" id="btnSearch" aria-label="Buscar">🔍</button>
    <button class="ibtn" id="btnSettings" aria-label="Ajustes">⚙️</button>
  </div>
  <div id="results" class="card hidden"></div>
  <div id="banner" class="card hidden"><div class="ico" id="bIcon">↑</div><div><div class="d" id="bDist"></div><div class="t" id="bText"></div></div></div>
  <div id="toast" class="card hidden"><div class="ico" id="tIcon"></div><div id="tText"></div></div>
</div>

<div id="side">
  <button class="ibtn" id="btnFollow" aria-label="Centrar">🎯</button>
  <button class="ibtn" id="btnZoomIn">＋</button>
  <button class="ibtn" id="btnZoomOut">－</button>
</div>
<div id="simtag" class="simtag hidden">SIMULACIÓN</div>

<div id="bottom" class="ui">
  <div id="routes" class="card hidden"></div>
  <div id="poi" class="card hidden"></div>
  <div id="hud" class="card hidden">
    <div id="spd"><b id="spdV">0</b><small>km/h</small></div>
    <div id="lim" class="hidden">–</div>
    <div id="info"><div class="big" id="eta">—</div><div id="rem"></div><div class="road" id="road"></div></div>
    <button class="btn bad" id="btnStop">Fin</button>
  </div>
</div>

<div id="modal" class="hidden">
  <div id="sheet">
    <h2>Ajustes y avisos</h2>
    <h3>Avisos</h3>
    <label class="sw">📷 Autovelox y tutor <input type="checkbox" data-k="camera"></label>
    <label class="sw">🚦 Cámaras de semáforo <input type="checkbox" data-k="redlight"></label>
    <label class="sw">🚫 Varcos ZTL / carril bus <input type="checkbox" data-k="zone"></label>
    <label class="sw">🚧 Pasos a nivel <input type="checkbox" data-k="crossing"></label>
    <label class="sw">🏫 Escuelas <input type="checkbox" data-k="school"></label>
    <label class="sw">⤴ Curvas peligrosas <input type="checkbox" data-k="curve"></label>
    <label class="sw">↱ Indicaciones de giro <input type="checkbox" data-k="turn"></label>
    <h3>Sonido y pantalla</h3>
    <label class="sw">🔊 Voz (italiano) <input type="checkbox" id="sVoice"></label>
    <label class="sw">🔔 Pitido de alerta <input type="checkbox" id="sBeep"></label>
    <label class="sw">🌙 Mapa oscuro <input type="checkbox" id="sDark"></label>
    <label class="sw">Tolerancia de velocidad
      <select id="sTol"><option value="0">0 km/h</option><option value="5">5 km/h</option><option value="10">10 km/h</option></select></label>
    <div class="note">Los datos de autovelox, límites, escuelas y pasos a nivel vienen de OpenStreetMap, que puede estar incompleto o desactualizado. No incluye controles móviles ni tráfico en vivo. Conduce siempre atento a las señales reales.</div>
    <div class="row" style="margin-top:14px"><button class="btn pri" id="btnCloseSet">Cerrar</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="nav.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
