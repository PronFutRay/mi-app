<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Busta Chiara · Leggi la tua busta paga</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f1f5f8;--card:#fff;--ink:#0b2a3a;--muted:#5b6f7e;--line:#e1e8ee;
  --brand:#0f9d8a;--brand2:#27c4a8;--navy:#0b2a3a;--navy2:#13465c;
  --ok:#12a36b;--warn:#c77700;--bad:#c0392b;
  --c1:#0f9d8a;--c2:#3b82f6;--c3:#f59e0b;--c4:#94a3b8;
  --shadow:0 1px 2px rgba(11,42,58,.06),0 8px 24px rgba(11,42,58,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#08161f;--card:#0f2431;--ink:#e8f1f6;--muted:#8fa5b3;--line:#1b3646;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 74px}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;box-shadow:0 6px 16px rgba(15,157,138,.4)}
.brand h1{font-size:20px;letter-spacing:.2px}
.brand p{font-size:12.5px;opacity:.78}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:99px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:99px;cursor:pointer;opacity:.75}
.lang button.on{background:#fff;color:var(--navy);opacity:1}
main{margin-top:-54px;padding:0 14px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:12px}
.hello{font-size:15px;font-weight:700;color:var(--brand);margin-bottom:6px}
.up h3{font-size:20px;margin-bottom:4px}
.up .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:14px 18px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;flex:1;min-width:150px}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;box-shadow:0 8px 18px rgba(15,157,138,.32)}
.btn.small{padding:9px 14px;font-size:13.5px;min-width:0;flex:0 0 auto}
.btn:active{transform:scale(.98)}
.drop{margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--muted);font-size:13.5px}
.drop.over{border-color:var(--brand);background:rgba(15,157,138,.07)}
.priv{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin-top:14px}
.priv svg{flex:0 0 auto;margin-top:1px}
.link{background:none;border:0;color:var(--brand);font-weight:700;font-size:13.5px;cursor:pointer;padding:6px 0;margin-top:6px;text-decoration:underline}
.prog{display:none}
.prog .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 8px}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .25s}
.prog .st{font-size:14px;color:var(--muted)}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}
.hero .per{font-size:13px;opacity:.8;margin-bottom:10px}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero .l{font-size:12.5px;opacity:.75}
.hero .v{font-size:46px;font-weight:800;line-height:1.05}
.hero .v small{font-size:20px;font-weight:600;opacity:.8;margin-left:4px}
.hero .s{text-align:right}
.hero .s .v{font-size:24px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:12px;background:rgba(255,255,255,.14);border-radius:99px;padding:4px 10px}
.brief{list-style:none;padding:0;display:grid;gap:10px}
.brief li{display:flex;gap:10px;font-size:15px}
.brief li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--brand);margin-top:7px}
.split{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--line);margin-bottom:12px}
.split i{display:block;height:100%}
.leg{display:grid;gap:8px}
.leg div{display:flex;align-items:center;gap:8px;font-size:14px}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums}
.leg span.d{width:10px;height:10px;border-radius:50%}
.leg em{font-style:normal;color:var(--muted);font-size:12.5px;min-width:44px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{border:1px solid var(--line);border-radius:14px;padding:12px}
.st .k{font-size:12px;color:var(--muted);font-weight:600}
.st .n{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.st .n small{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:3px}
.st .h{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.fc{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.fc:last-child{margin-bottom:0}
.fc .t{font-weight:700;font-size:16px}
.fc .hd{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.fc .g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fc .g div{text-align:center}
.fc .g b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.fc .g span{font-size:11px;color:var(--muted);line-height:1.2;display:block}
.fc .g .sal b{color:var(--brand)}
.fc .pb{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.fc .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.fc .pl{font-size:11.5px;color:var(--muted);margin-top:5px}
.list{display:grid;gap:0}
.list .it{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .it:last-child{border-bottom:0}
.list .it b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lh{font-size:12px;color:var(--muted);margin:12px 0 2px}
.note{font-size:13.5px;border-radius:12px;padding:11px 13px;margin-top:12px}
.note.ok{background:rgba(18,163,107,.12);color:var(--ok)}
.note.warn{background:rgba(199,119,0,.13);color:var(--warn)}
.note.info{background:rgba(15,157,138,.1);color:var(--ink)}
.muted{color:var(--muted);font-size:13px}
details summary{cursor:pointer;font-weight:700;font-size:14px}
textarea{width:100%;min-height:180px;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:transparent;color:var(--ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.disc{font-size:12px;color:var(--muted);text-align:center;padding:4px 8px 10px}
.hidden{display:none!important}
#errbox{display:none;background:#fdecea;color:#7a1c12;border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:13px;line-height:1.4;word-break:break-word}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:18px;padding:20px;max-width:380px;width:100%}
.modal h3{font-size:17px;margin-bottom:6px}
.modal p{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.modal input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:transparent;color:var(--ink);margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;transition:.25s;opacity:0;z-index:30;max-width:90%}
.toast.show{transform:translateX(-50%);opacity:1}
@media(max-width:420px){.hero .v{font-size:38px}.fc .g b{font-size:16px}}
@media print{header,.up,.prog,.acts,.disc,details,.modal,#errbox,#bAmb,.toast{display:none!important}main{margin-top:0}.card,.hero{box-shadow:none}}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand">
      <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/></svg></div>
      <div><h1>Busta Chiara</h1><p id="tag"></p></div>
    </div>
    <div class="lang" role="group" aria-label="Lingua / Idioma"><button id="l-it">IT</button><button id="l-es">ES</button></div>
  </div>
</header>

<main class="wrap">
  <div id="errbox"></div>
  <section class="card up" id="upload">
    <div class="hello">Ciao Vega 👋</div>
    <h3 id="up_title"></h3>
    <p class="sub" id="up_sub"></p>
    <div class="btns">
      <button class="btn primary" id="bPhoto"></button>
      <button class="btn" id="bFile"></button>
    </div>
    <div class="drop" id="drop"></div>
    <button class="link" id="bDemo"></button>
    <div class="priv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span id="priv"></span></div>
    <input id="fPhoto" type="file" accept="image/*" capture="environment" class="hidden">
    <input id="fFile" type="file" accept="image/*,application/pdf,.pdf" multiple class="hidden">
  </section>

  <section class="card prog" id="prog">
    <h2 id="prog_t"></h2>
    <div class="bar"><i id="pbar"></i></div>
    <div class="st" id="pst"></div>
    <div class="acts" style="margin:12px 0 0"><button class="btn small" id="bCancel"></button></div>
  </section>

  <div id="out" class="hidden"></div>

  <p class="disc" id="disc"></p>
</main>

<div class="modal" id="pwModal">
  <div class="box">
    <h3 id="pw_t"></h3><p id="pw_p"></p>
    <input id="pwIn" type="password" autocomplete="off" autocapitalize="off">
    <div class="btns"><button class="btn small" id="pwNo"></button><button class="btn primary small" id="pwOk"></button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var errs=[];
  function show(){var b=document.getElementById("errbox");if(!b)return;b.style.display="block";b.textContent="Errore / Error: "+errs.join(" | ")+" — Ricarica la pagina / Recarga la página.";}
  window.addEventListener("error",function(e){
    var t=e.target;
    if(t&&t.tagName==="SCRIPT"){var sr=t.getAttribute("src")||"";if(sr.indexOf("vendor/")===0)return;errs.push("no se pudo cargar "+sr);}
    else errs.push((e.message||"error")+" ("+String(e.filename||"").split("/").pop()+":"+(e.lineno||"")+")");
    show();
  },true);
  window.addEventListener("unhandledrejection",function(e){errs.push("promesa: "+((e.reason&&e.reason.message)||e.reason));show();});
  setTimeout(function(){if(!window.__bcReady){errs.push("la app no se ha iniciado");show();}},3000);
})();
</script>
<script src="parser.js?v=7"></script>
<script src="sample.js?v=7"></script>
<script src="config.js?v=7"></script>
<script src="app.js?v=7"></script>
<script src="money.js?v=7"></script>
</body>
</html>
