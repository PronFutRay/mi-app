<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../gpl-icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../gpl-icons/favicon-32.png">
<link rel="apple-touch-icon" href="../gpl-icons/apple-touch-icon.png">
<title>{{title}}</title>
<style>
:root{
  --bg:#f2f5f9;--card:#fff;--ink:#0b1f3a;--muted:#5d6b82;--line:#e2e8f0;
  --brand:#ff6a1a;--brand2:#ff9a3d;--navy:#0b1f3a;--navy2:#16365f;--ok:#12a36b;--warn:#c77700;--bad:#d64545;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 8px 24px rgba(11,31,58,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a1424;--card:#101e35;--ink:#eaf0fa;--muted:#93a3bd;--line:#1e2f4b;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 70px}
.wrap{max-width:880px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;box-shadow:0 6px 16px rgba(255,106,26,.4);flex:0 0 auto}
.brand h1{font-size:20px;letter-spacing:.2px}
.brand p{font-size:12.5px;opacity:.75}
.hi{font-size:13px;font-weight:700;color:var(--brand2);opacity:1!important;margin-top:2px}
.tiny{font-size:7px;opacity:.45;text-align:center;letter-spacing:.12em;padding:0 0 6px}
main{margin-top:-52px;padding:0 16px 40px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.ttl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.big{display:flex;align-items:center;gap:10px;margin-top:8px}
.big input{flex:1;min-width:0;font-size:44px;font-weight:700;border:2px solid var(--line);border-radius:14px;padding:10px 16px;background:transparent;color:var(--ink);text-align:center;outline:none;transition:.15s}
.big input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,106,26,.15)}
.unit{font-size:22px;font-weight:700;color:var(--brand)}
.step{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:26px;cursor:pointer}
.step:active{transform:scale(.95)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px}
.f input,.f select,.city input{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;background:transparent;color:var(--ink);outline:none;font-family:inherit}
.f select option{color:#111}
.f input:focus,.f select:focus,.city input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,106,26,.15)}
.f input[readonly]{background:rgba(127,127,127,.08)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.temp-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.temp-box{display:flex;align-items:baseline;gap:4px;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.temp-box input{width:74px;font-size:28px;font-weight:700;border:0;background:transparent;color:var(--ink);outline:none;text-align:right}
.temp-box span{font-weight:600;color:var(--muted)}
.badge{font-size:12px;border-radius:99px;padding:4px 10px;font-weight:600;background:rgba(18,163,107,.12);color:var(--ok)}
.badge.warn{background:rgba(199,119,0,.14);color:var(--warn)}
.badge.bad{background:rgba(214,69,69,.14);color:var(--bad)}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;box-shadow:0 6px 16px rgba(255,106,26,.3)}
.city{display:flex;gap:8px;margin-top:12px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero .v{font-size:56px;font-weight:800;line-height:1}
.hero .v small{font-size:22px;font-weight:600;opacity:.8;margin-left:6px}
.hero .t{font-size:13px;opacity:.75}
.hero .side{text-align:right;font-size:13px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.m{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card)}
.m.bad{border-color:var(--bad);background:rgba(214,69,69,.06)}
.m .k{font-size:12px;color:var(--muted);font-weight:600}
.m .n{font-size:24px;font-weight:700;margin-top:4px}
.m .n small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.m .h{font-size:11.5px;color:var(--muted);margin-top:2px}
.m.bad .h{color:var(--bad);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tbl{overflow-x:auto}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:6px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;transition:.25s;opacity:0;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%);opacity:1}
@media(max-width:480px){.hero .v{font-size:46px}.big input{font-size:36px}.hero .side{text-align:left}}
#report{display:none}
#report h1{font-size:22px;margin-bottom:2px}
#report h1 .das-t{color:#ff6a1a;font-weight:700}
#report .sub{color:#555;font-size:12px;margin-bottom:16px}
#report h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px;border-bottom:2px solid #ff6a1a;padding-bottom:4px}
#report table td,#report table th{border-bottom:1px solid #ddd;color:#000}
#report .sign{margin-top:40px;font-size:13px;color:#000}
@page{margin:16mm}
@media print{html,body{background:#fff!important;color:#000!important}header,main,.toast{display:none!important}#report{display:block}}
</style>
</head>
<body>
<header>
  <div class="wrap brand">
    <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 2c.6 3.2 4 5.2 4 9.4A4 4 0 0 1 12 15.5a4 4 0 0 1-4-4.1c0-1.6.8-2.8 1.8-3.9C10.2 8.6 11 9.3 11.4 10 11.9 7.6 11.6 4.6 12 2zM12 22a6 6 0 0 1-6-6c0-1.2.4-2.3 1-3.2.7 1.6 2.2 2.7 4 3.1 1.6.4 3.2.1 4.4-.9.4.9.6 1.9.6 3A6 6 0 0 1 12 22z"/></svg></div>
    <div><h1>GPL Calc</h1><p>{{subtitle}}</p><p class="hi">Ciao Vega 👋</p></div>
  </div>
</header>

<main class="wrap">
  <!-- 1. Consegna -->
  <section class="card">
    <div class="ttl">{{sec_delivery}}</div>
    <div class="f">
      <div><label for="das">{{das}}</label><input id="das" placeholder="{{das_ph}}" autocomplete="off" autocapitalize="characters" maxlength="40"></div>
      <div><label for="cli">{{client}}</label><input id="cli" autocomplete="off" maxlength="80"></div>
      <div><label for="addr">{{address}}</label><input id="addr" autocomplete="off" maxlength="120"></div>
      <div><label for="plate">{{plate}}</label><input id="plate" autocomplete="off" autocapitalize="characters" maxlength="20"></div>
      <div><label for="drv">{{driver}}</label><input id="drv" autocomplete="off" maxlength="60"></div>
    </div>
  </section>

  <!-- 2. Misure -->
  <section class="card">
    <div class="ttl">{{sec_measure}}</div>
    <div class="f">
      <div><label for="mIni">{{meter_start}}</label><input id="mIni" type="number" step="0.1" min="0" inputmode="decimal"></div>
      <div><label for="mFin">{{meter_end}}</label><input id="mFin" type="number" step="0.1" min="0" inputmode="decimal"></div>
    </div>
    <div class="label" style="margin-top:16px">{{liters_label}}</div>
    <div class="big">
      <button class="step" id="minus" aria-label="−">−</button>
      <input id="liters" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="{{liters_label}}">
      <span class="unit">L</span>
      <button class="step" id="plus" aria-label="+">+</button>
    </div>
    <div class="hint" id="meterHint">{{meter_hint}}</div>
    <div class="f" style="margin-top:14px">
      <div><label for="rho15">{{rho15}}</label><input id="rho15" type="number" step="0.0001" min="0.45" max="0.65" value="0.5040" inputmode="decimal"></div>
    </div>
  </section>

  <!-- 3. Temperatura -->
  <section class="card">
    <div class="ttl">{{sec_temp}}</div>
    <div class="temp-row">
      <div class="temp-box"><input id="temp" type="number" step="0.1" aria-label="°C"><span>°C</span></div>
      <span class="badge warn" id="tsrc">…</span>
      <button class="btn" id="geo">{{use_pos}}</button>
    </div>
    <form class="city" id="cityForm">
      <input id="city" placeholder="{{city_ph}}" aria-label="{{city_ph}}">
      <button class="btn" type="submit">{{search}}</button>
    </form>
    <div class="hint">{{temp_hint}}</div>
  </section>

  <!-- 4. Serbatoio cliente -->
  <section class="card">
    <div class="ttl">{{sec_tank}}</div>
    <div class="f">
      <div><label for="cap">{{tank_cap}}</label><input id="cap" type="number" step="1" min="0" inputmode="decimal" placeholder="{{tank_cap_ph}}"></div>
      <div><label for="pIni">{{tank_before}}</label><input id="pIni" type="number" step="1" min="0" max="100" inputmode="decimal"></div>
      <div><label for="fill">{{tank_limit}}</label><input id="fill" type="number" step="1" min="50" max="100" value="80" inputmode="decimal"></div>
    </div>
  </section>

  <!-- 5. Accisa -->
  <section class="card">
    <div class="ttl">{{sec_excise}}</div>
    <div class="f">
      <div><label for="use">{{use}}</label>
        <select id="use"><option value="heat">{{use_heat}}</option><option value="fuel">{{use_fuel}}</option><option value="custom">{{use_custom}}</option></select></div>
      <div><label for="rate">{{rate}}</label><input id="rate" type="number" step="0.00001" min="0" inputmode="decimal"></div>
    </div>
    <div class="hint">{{excise_hint}}</div>
  </section>

  <!-- Risultato -->
  <section class="hero">
    <div>
      <div class="t">{{hero_t}}</div>
      <div class="v"><span id="kg">—</span><small>kg</small></div>
    </div>
    <div class="side" id="heroSide">{{start_hint}}</div>
  </section>

  <section class="card">
    <div class="grid" id="grid"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn primary" id="save">{{save}}</button>
      <button class="btn" id="pdf">{{pdf_one}}</button>
      <button class="btn" id="copy">{{copy}}</button>
    </div>
  </section>

  <section class="card">
    <div class="ttl"><span>{{history}}</span>
      <span class="row"><button class="btn" id="csv">{{csv}}</button><button class="btn" id="pdf2">{{pdf_hist}}</button><button class="btn" id="clear">{{clear}}</button></span></div>
    <div class="tbl" id="hist"></div>
  </section>

  <p class="foot">{{foot}}<br>Di <a href="https://github.com/PronFutRay" style="color:inherit">PronFutRay</a></p>
  <div class="tiny">Raul</div>
</main>
<div id="report"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var TX={{TXJSON}};
var LOCALE="{{locale}}";
var $=function(i){return document.getElementById(i)};
var KEY="gplcalc.v1";
var RATES={heat:189.94458,fuel:267.77};   /* €/1000 kg – Agenzia Dogane e Monopoli (verificare aggiornamenti) */
var S={rho15:"0.5040",fill:80,use:"heat",rate:"",plate:"",drv:"",mIni:"",city:null,lastTemp:null,hist:[]};
try{var raw=JSON.parse(localStorage.getItem(KEY)||"null");if(raw)for(var k in raw)S[k]=raw[k];}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var last=null;

function num(id){var v=parseFloat(String($(id).value).replace(",","."));return isFinite(v)?v:NaN}
function fmt(n,d){if(d==null)d=1;return isFinite(n)?n.toLocaleString(LOCALE,{minimumFractionDigits:d,maximumFractionDigits:d}):"—"}
function fill2(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k]!=null?o[k]:""})}
function toast(m,ms){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.tm);toast.tm=setTimeout(function(){t.classList.remove("show")},ms||2200)}
function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ---------- Física ---------- */
var RHO_P=0.507,RHO_B=0.579,BETA_P=0.0030,BETA_B=0.0020,M_P=44.1,M_B=58.12;
function psat(a,b,c,t){return Math.pow(10,a-b/(c+t))*0.00133322}
function compute(L,temp,rho15){
  /* densità di riferimento a 15 °C (dal DAS); la miscela propano/butano si stima da essa */
  var p=Math.min(1,Math.max(0,(RHO_B-rho15)/(RHO_B-RHO_P))),b=1-p;
  var beta=p*BETA_P+b*BETA_B;
  var rho=rho15*(1-beta*(temp-15));
  var kg=L*rho,v15=kg/rho15;
  var nP=p/M_P,nB=b/M_B,xP=nP/(nP+nB),xB=1-xP;
  var pAbs=xP*psat(6.82973,813.2,248,temp)+xB*psat(6.82485,943.453,239.711,temp);
  return {rho:rho,rho15:rho15,kg:kg,v15:v15,dv:L-v15,pg:Math.max(pAbs-1.013,0)};
}

/* ---------- Render ---------- */
var cur=[];
function card(k,n,u,h,bad){cur.push([k,n+" "+u]);return '<div class="m'+(bad?' bad':'')+'"><div class="k">'+k+'</div><div class="n">'+n+'<small>'+u+'</small></div>'+(h?'<div class="h">'+h+'</div>':'')+'</div>'}
function readL(){var v=num("liters");return v>0?v:0}
function rateNow(){var u=$("use").value;if(u!=="custom"){return RATES[u]}var r=num("rate");return r>=0?r:0}
function render(){
  var L=readL();
  var rr=num("rho15");if(!(rr>0.45&&rr<0.65))rr=0.504;
  var temp=num("temp");if(!isFinite(temp))temp=15;
  if(!L){last=null;$("kg").textContent="—";$("heroSide").textContent=TX.start_hint;$("grid").innerHTML='<div class="empty">'+TX.results_here+'</div>';return}
  var r=compute(L,temp,rr);
  var rate=rateNow();r.rate=rate;r.acc=r.kg*rate/1000;
  var cap=num("cap"),pIni=num("pIni"),lim=num("fill");if(!(lim>0))lim=80;
  if(cap>0&&pIni>=0){r.cap=cap;r.pIni=pIni;r.lim=lim;r.pFin=pIni+L/cap*100;r.room=cap*(lim-pIni)/100;r.over=r.pFin>lim+0.05}
  last={L:L,T:temp,r:r};
  $("kg").textContent=fmt(r.kg,2);
  $("heroSide").innerHTML=fmt(L,1)+" L · "+fmt(temp,1)+" °C<br>"+TX.l15+": <b>"+fmt(r.v15,1)+" L</b>";
  cur=[];var h="";
  h+=card(TX.l15,fmt(r.v15,1),"L",(r.dv>=0?"+":"")+fmt(r.dv,1)+" L "+TX.vs_real);
  h+=card(fill2(TX.dens_at,{t:fmt(temp,1)}),fmt(r.rho,4),"kg/L",TX.ref15+": "+fmt(r.rho15,4));
  if(r.cap!=null){
    h+=card(TX.tank_after,fmt(r.pFin,1),"%",r.over?fill2(TX.over_limit,{l:fmt(lim,0)}):fill2(TX.within_limit,{l:fmt(lim,0)}),r.over);
    h+=card(TX.room,fmt(Math.max(0,r.room),0),"L",fill2(TX.room_h,{p:fmt(pIni,0),l:fmt(lim,0)}),r.room<L);
  }
  h+=card(TX.excise,fmt(r.acc,2),"€",fmt(rate,2)+" €/1000 kg · "+$("use").options[$("use").selectedIndex].text);
  h+=card(TX.pressure,fmt(r.pg,1),"bar",TX.pressure_h);
  $("grid").innerHTML=h;
}
function meter(){
  var a=num("mIni"),b=num("mFin");
  if(isFinite(a)&&isFinite(b)&&b>a){$("liters").value=Math.round((b-a)*10)/10;$("liters").readOnly=true;$("meterHint").textContent=TX.meter_auto}
  else{$("liters").readOnly=false;$("meterHint").textContent=(isFinite(a)&&isFinite(b)&&b<=a)?TX.meter_bad:TX.meter_hint}
  S.mIni=$("mIni").value;persist();render();
}

/* ---------- Temperatura ---------- */
function setTemp(v,src,label){
  $("temp").value=(Math.round(v*10)/10);
  var b=$("tsrc");
  if(src==="auto"){b.className="badge";b.textContent=TX.t_auto+" · "+(label||TX.t_pos)}
  else if(src==="cache"){b.className="badge warn";b.textContent=TX.t_cache}
  else{b.className="badge warn";b.textContent=TX.t_default}
  if(src==="auto"){S.lastTemp={v:v,label:label};persist()}
  render();
}
function fetchTemp(lat,lon,label){
  $("tsrc").className="badge warn";$("tsrc").textContent=TX.t_reading;
  return fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m")
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(j){var t=j.current&&j.current.temperature_2m;if(typeof t!=="number")throw 0;setTemp(t,"auto",label)})
    .catch(function(){fallback()});
}
function fallback(){if(S.lastTemp)setTemp(S.lastTemp.v,"cache");else setTemp(15,"default")}
function geolocate(){
  if(!navigator.geolocation){fallback();return}
  $("tsrc").className="badge warn";$("tsrc").textContent=TX.t_locating;
  navigator.geolocation.getCurrentPosition(function(pos){
    S.city=null;persist();
    fetchTemp(pos.coords.latitude.toFixed(3),pos.coords.longitude.toFixed(3),TX.t_pos);
  },function(){fallback();toast(TX.t_nopos,3500)},{timeout:8000,maximumAge:600000});
}
function searchCity(q){
  fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=1&language={{lang}}")
   .then(function(r){return r.json()})
   .then(function(j){
     if(!j.results||!j.results.length){toast(TX.city_nf);return}
     var c=j.results[0];S.city={lat:c.latitude,lon:c.longitude,name:c.name};persist();
     fetchTemp(c.latitude,c.longitude,c.name);
   }).catch(function(){toast(TX.city_net)});
}

/* ---------- Storico ---------- */
function entry(){
  var r=last.r;
  return {t:new Date().toISOString(),das:$("das").value.trim(),cli:$("cli").value.trim(),addr:$("addr").value.trim(),plate:$("plate").value.trim(),drv:$("drv").value.trim(),
    mIni:$("mIni").value,mFin:$("mFin").value,L:last.L,T:last.T,rho15:r.rho15,v15:r.v15,kg:r.kg,acc:r.acc,rate:r.rate,use:$("use").value,
    cap:r.cap!=null?r.cap:null,pIni:r.pIni!=null?r.pIni:null,pFin:r.pFin!=null?r.pFin:null};
}
function dt(t){var d=new Date(t);return d.toLocaleDateString(LOCALE,{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+d.toLocaleTimeString(LOCALE,{hour:"2-digit",minute:"2-digit"})}
function histRows(full){
  var h="<table><thead><tr><th>"+TX.h_date+"</th><th>DAS</th><th>"+TX.h_client+"</th><th>"+TX.h_liters+"</th><th>°C</th><th>"+TX.h_l15+"</th><th>kg</th><th>"+TX.h_excise+"</th></tr></thead><tbody>";
  S.hist.slice().reverse().forEach(function(e){
    h+="<tr><td>"+dt(e.t)+"</td><td>"+esc(e.das||"—")+"</td><td>"+esc(e.cli||"—")+"</td><td>"+fmt(e.L,1)+"</td><td>"+fmt(e.T,1)+"</td><td>"+(e.v15!=null?fmt(e.v15,1):"—")+"</td><td>"+fmt(e.kg,2)+"</td><td>"+(e.acc!=null?fmt(e.acc,2):"—")+"</td></tr>";
  });
  return h+"</tbody></table>";
}
function renderHist(){$("hist").innerHTML=S.hist.length?histRows():'<div class="empty">'+TX.no_hist+'</div>'}

/* ---------- APK (Android): guardar/compartir archivos ---------- */
var NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
function nativeShare(name,b64){
  var P=window.Capacitor.Plugins;
  return P.Filesystem.writeFile({path:name,data:b64,directory:"CACHE"}).then(function(w){
    return P.Share.share({title:name,url:w.uri,dialogTitle:name});
  }).catch(function(e){if(!/cancel/i.test(String(e&&e.message)))toast(TX.export_err)});
}
function loadJsPDF(){return window.jspdf?Promise.resolve():new Promise(function(ok,ko){var s=document.createElement("script");s.src="jspdf.umd.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
function reportToPDF(name){   /* dibuja el informe (#report) como PDF de texto */
  return loadJsPDF().then(function(){
    var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),y=16,W=180,X=15;
    function room(h){if(y+h>285){doc.addPage();y=16}}
    function txt(e){return (e.textContent||"").replace(/\s+/g," ").trim()}
    Array.prototype.forEach.call($("report").children,function(el){
      var tag=el.tagName;
      if(tag==="H1"){doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(0);var L=doc.splitTextToSize(txt(el),W);room(L.length*7);doc.text(L,X,y);y+=L.length*7}
      else if(tag==="H2"){y+=4;room(8);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(0);doc.text(txt(el),X,y);y+=6}
      else if(tag==="TABLE"){
        el.querySelectorAll("tr").forEach(function(tr){
          var cells=tr.querySelectorAll("td,th"),n=cells.length,cw=n===2?[100,80]:[27,27,36,18,12,20,20,20];
          var head=tr.querySelector("th")||tr.querySelector("b");
          doc.setFont("helvetica",head?"bold":"normal");doc.setFontSize(n===2?10:8);doc.setTextColor(0);
          var lines=[],h=0,x=X;
          cells.forEach(function(c,i){var t=doc.splitTextToSize(txt(c),(cw[i]||20)-2);lines.push(t);h=Math.max(h,t.length)});
          room(h*4.6+2);
          lines.forEach(function(t,i){doc.text(t,x,y);x+=cw[i]||20});
          y+=h*4.6+1.5;doc.setDrawColor(225);doc.line(X,y-3,X+W,y-3);
        });
      } else if(el.className==="sign"){y+=14;room(12);doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(0);doc.text(txt(el),X,y);y+=8}
      else {doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(110);var L2=doc.splitTextToSize(txt(el),W);room(L2.length*4.5);doc.text(L2,X,y+2);y+=L2.length*4.5+3}
    });
    return nativeShare(name+".pdf",doc.output("datauristring").split(",")[1]);
  });
}
function dl(name,text,type){
  if(NATIVE){nativeShare(name,btoa(unescape(encodeURIComponent(text))));return}
  var b=new Blob([text],{type:type});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function printReport(h,name){
  $("report").innerHTML=h;
  if(NATIVE){reportToPDF(name).catch(function(){toast(TX.export_err)});return}
  var old=document.title;document.title=name;
  window.addEventListener("afterprint",function f(){document.title=old;window.removeEventListener("afterprint",f)});
  setTimeout(function(){window.print()},50);
}
function tr(k,v,b){return "<tr><td>"+(b?"<b>"+esc(k)+"</b>":esc(k))+"</td><td>"+(b?"<b>"+esc(v)+"</b>":esc(v))+"</td></tr>"}
function stamp(){var now=new Date();return fill2(TX.generated,{d:now.toLocaleDateString(LOCALE,{day:"2-digit",month:"long",year:"numeric"}),h:now.toLocaleTimeString(LOCALE,{hour:"2-digit",minute:"2-digit"})})}
function exportOne(){
  if(!last){toast(TX.need_liters);return}
  var r=last.r,dasV=$("das").value.trim(),now=new Date();
  var h='<h1>'+TX.doc_title+(dasV?' <span class="das-t">· DAS n° '+esc(dasV)+'</span>':'')+'</h1><div class="sub">'+stamp()+'</div>';
  h+="<h2>"+TX.sec_delivery+"</h2><table><tbody>"+tr(TX.client,$("cli").value.trim()||"—")+tr(TX.address,$("addr").value.trim()||"—")+tr(TX.plate,$("plate").value.trim()||"—")+tr(TX.driver,$("drv").value.trim()||"—")+"</tbody></table>";
  h+="<h2>"+TX.sec_measure+"</h2><table><tbody>";
  if($("mIni").value!==""||$("mFin").value!=="")h+=tr(TX.meter_start,$("mIni").value?fmt(num("mIni"),1)+" L":"—")+tr(TX.meter_end,$("mFin").value?fmt(num("mFin"),1)+" L":"—");
  h+=tr(TX.liters_label,fmt(last.L,1)+" L")+tr(TX.sec_temp,fmt(last.T,1)+" °C")+tr(TX.rho15,fmt(r.rho15,4)+" kg/L")+tr(fill2(TX.dens_at,{t:fmt(last.T,1)}),fmt(r.rho,4)+" kg/L")+tr(TX.l15,fmt(r.v15,1)+" L",true)+tr(TX.hero_t,fmt(r.kg,2)+" kg",true)+"</tbody></table>";
  if(r.cap!=null)h+="<h2>"+TX.sec_tank+"</h2><table><tbody>"+tr(TX.tank_cap,fmt(r.cap,0)+" L")+tr(TX.tank_before,fmt(r.pIni,0)+" %")+tr(TX.tank_after,fmt(r.pFin,1)+" %"+(r.over?" ⚠":""))+tr(TX.tank_limit,fmt(r.lim,0)+" %")+"</tbody></table>";
  h+="<h2>"+TX.sec_excise+"</h2><table><tbody>"+tr(TX.use,$("use").options[$("use").selectedIndex].text)+tr(TX.rate,fmt(r.rate,5)+" €/1000 kg")+tr(TX.excise,fmt(r.acc,2)+" €",true)+"</tbody></table>";
  h+='<p class="sign">'+TX.sign_drv+' ______________________      '+TX.sign_cli+' ______________________</p>';
  h+='<p class="sub" style="margin-top:18px">'+TX.doc_note+'</p>';
  printReport(h,TX.file_one+"-"+(dasV||now.toISOString().slice(0,10)).replace(/[^\w-]/g,""));
}
function exportHist(){
  if(!S.hist.length){toast(TX.no_data);return}
  var h='<h1>'+TX.hist_title+'</h1><div class="sub">'+stamp()+'</div>'+histRows();
  var tk=0,tl=0,ta=0;S.hist.forEach(function(e){tk+=e.kg||0;tl+=e.v15||0;ta+=e.acc||0});
  h+="<h2>"+TX.totals+"</h2><table><tbody>"+tr(TX.h_count,String(S.hist.length))+tr(TX.l15,fmt(tl,1)+" L")+tr("kg",fmt(tk,2)+" kg",true)+tr(TX.excise,fmt(ta,2)+" €")+"</tbody></table>";
  printReport(h,TX.file_hist+"-"+new Date().toISOString().slice(0,10));
}

/* ---------- Eventi ---------- */
function saveSettings(){S.rho15=$("rho15").value;S.fill=$("fill").value;S.use=$("use").value;S.rate=$("rate").value;S.plate=$("plate").value;S.drv=$("drv").value;persist()}
$("liters").addEventListener("input",render);
["mIni","mFin"].forEach(function(id){$(id).addEventListener("input",meter)});
["rho15","fill","cap","pIni","rate"].forEach(function(id){$(id).addEventListener("input",function(){saveSettings();render()})});
["plate","drv"].forEach(function(id){$(id).addEventListener("input",saveSettings)});
$("use").addEventListener("change",function(){var u=$("use").value;$("rate").readOnly=u!=="custom";if(u!=="custom")$("rate").value=RATES[u];saveSettings();render()});
$("temp").addEventListener("input",function(){if(isFinite(num("temp"))){$("tsrc").className="badge";$("tsrc").textContent=TX.t_manual;render()}});
$("minus").onclick=function(){if($("liters").readOnly)return;var v=Math.max(0,readL()-1);$("liters").value=v||"";render()};
$("plus").onclick=function(){if($("liters").readOnly)return;$("liters").value=readL()+1;render()};
$("geo").onclick=geolocate;
$("cityForm").addEventListener("submit",function(e){e.preventDefault();var q=$("city").value.trim();if(q)searchCity(q)});
$("save").onclick=function(){
  if(!last){toast(TX.need_liters);return}
  S.hist.push(entry());if(S.hist.length>500)S.hist.shift();
  /* pronto per la prossima consegna: la lettura finale diventa quella iniziale */
  var fin=$("mFin").value;
  ["das","cli","addr","cap","pIni","mFin","liters"].forEach(function(id){$(id).value=""});
  $("mIni").value=fin;S.mIni=fin;persist();meter();renderHist();toast(TX.saved,3000);
};
$("copy").onclick=function(){
  if(!last){toast(TX.need_liters);return}
  var r=last.r,L=[];
  if($("das").value.trim())L.push("DAS n° "+$("das").value.trim());
  if($("cli").value.trim())L.push(TX.client+": "+$("cli").value.trim());
  L.push(TX.liters_label+": "+fmt(last.L,1)+" L · "+fmt(last.T,1)+" °C");
  L.push(TX.l15+": "+fmt(r.v15,1)+" L");
  L.push(TX.hero_t+": "+fmt(r.kg,2)+" kg");
  L.push(TX.rho15+": "+fmt(r.rho15,4));
  if(r.cap!=null)L.push(TX.tank_after+": "+fmt(r.pFin,1)+" %");
  L.push(TX.excise+": "+fmt(r.acc,2)+" €");
  var t=L.join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast(TX.copied)},function(){
    var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast(TX.copied)}catch(e){}a.remove()});
};
$("csv").onclick=function(){
  var list=S.hist.slice();
  if(!list.length&&last)list=[entry()];
  if(!list.length){toast(TX.no_data);return}
  var q=function(x){return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'},n=function(x,d){return x==null||!isFinite(x)?"":String(Number(x).toFixed(d)).replace(".",",")};
  var rows=[TX.csv_head];
  list.forEach(function(e){rows.push([e.t,q(e.das),q(e.cli),q(e.addr),q(e.plate),q(e.drv),q(e.mIni),q(e.mFin),n(e.L,1),n(e.T,1),n(e.rho15,4),n(e.v15,1),n(e.kg,3),n(e.acc,2),n(e.pIni,0),n(e.pFin,1)].join(";"))});
  dl(TX.file_csv+".csv","﻿"+rows.join("\n"),"text/csv;charset=utf-8");
};
$("pdf").onclick=exportOne;$("pdf2").onclick=exportHist;
$("clear").onclick=function(){if(S.hist.length&&confirm(TX.confirm_clear)){S.hist=[];persist();renderHist()}};

/* ---------- Avvio ---------- */
$("rho15").value=S.rho15||"0.5040";$("fill").value=S.fill||80;$("use").value=S.use||"heat";
$("rate").value=S.use==="custom"?S.rate:RATES[S.use||"heat"];$("rate").readOnly=(S.use||"heat")!=="custom";
$("plate").value=S.plate||"";$("drv").value=S.drv||"";$("mIni").value=S.mIni||"";
renderHist();meter();
if(S.city){fetchTemp(S.city.lat,S.city.lon,S.city.name);$("city").value=S.city.name}else geolocate();
})();

<script>/* Estadísticas de uso (sin cookies ni datos personales) */
(function () {
  var U = "https://busta-chiara.raul-ronaldinio1.workers.dev/", S = "{{site}}", last = 0;
  function send(ev) {
    var now = Date.now(); if (ev === "ping" && now - last < 60000) return; last = now;
    try { fetch(U, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "track", site: S, ev: ev }), keepalive: true }).catch(function () {}); } catch (e) {}
  }
  send("view");
  setInterval(function () { if (document.visibilityState === "visible") send("ping"); }, 240000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") send("ping"); });
})();
