<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Dragon Shot</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: #1a1030; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; }
  #hud { display: flex; gap: 8px; padding: 8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left)); background: #120a24; align-items: center; justify-content: space-between; }
  .grp { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
  .row { display: flex; gap: 6px; align-items: center; }
  button { font: inherit; color: #fff; background: #3b2a6b; border: 2px solid #6b4fd1; border-radius: 12px; padding: 10px 14px; font-weight: 700; min-width: 48px; min-height: 48px; }
  button:active { background: #6b4fd1; }
  #fire { background: #d13b3b; border-color: #ff8a8a; min-width: 92px; font-size: 18px; }
  #fire:active { background: #ff5a5a; }
  #fire.charging { background: #ff9a3b; }
  .lbl { font-size: 12px; opacity: .85; text-align: center; min-width: 74px; }
  .lbl b { font-size: 16px; }
  #power { height: 10px; background: #2a1c52; border-radius: 6px; overflow: hidden; }
  #powerfill { height: 100%; width: 0%; background: linear-gradient(90deg,#4ade80,#facc15,#ef4444); }
  #menu, #over { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: rgba(15,8,35,.88); text-align: center; padding: 20px; z-index: 5; }
  #menu h1 { font-size: 42px; margin: 0; color: #ffb454; text-shadow: 0 3px 0 #7a2d00; }
  #menu p { margin: 0; opacity: .85; max-width: 420px; font-size: 14px; }
  #menu button, #over button { font-size: 18px; min-width: 220px; }
  .hidden { display: none !important; }
  #turn { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.45); padding: 4px 14px; border-radius: 14px; font-size: 14px; font-weight: 700; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="turn">—</div>

    <div id="menu">
      <h1>🐉 Dragon Shot</h1>
      <p>Artillería por turnos. Ajusta ángulo y fuerza, elige tu proyectil y destruye al dragón rival. ¡Cuidado con el viento!</p>
      <button id="vsCpu">Jugar contra la CPU</button>
      <button id="vs2">2 jugadores (mismo móvil)</button>
    </div>

    <div id="over" class="hidden">
      <h1 id="overTxt" style="font-size:34px;margin:0"></h1>
      <button id="again">Jugar otra vez</button>
      <button id="toMenu">Menú</button>
    </div>
  </div>

  <div id="hud">
    <div class="grp">
      <div class="row">
        <button id="left">◀</button>
        <button id="right">▶</button>
      </div>
      <div class="lbl">Mover</div>
    </div>

    <div class="grp">
      <div class="row">
        <button id="angDown">−</button>
        <div class="lbl">Ángulo<br><b id="angV">45°</b></div>
        <button id="angUp">+</button>
      </div>
      <div id="power"><div id="powerfill"></div></div>
    </div>

    <div class="grp">
      <div class="row">
        <button id="shotBtn">Normal</button>
        <button id="fire">🔥 FUEGO</button>
      </div>
      <div class="lbl" id="stats">Mantén FUEGO para cargar</div>
    </div>
  </div>
</div>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
