name: Deploy servidor IA (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["busta-paga/server/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprobar secretos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # quitar espacios o saltos de línea que se cuelan al pegar desde el móvil
          T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]'); echo "::add-mask::$T"
          # el ID de cuenta son 32 caracteres hexadecimales; si se pegó la dirección entera, se extrae de ahí
          A=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{32}' | head -1 || true)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -z "$A" ] && echo "::warning::CLOUDFLARE_ACCOUNT_ID no parece un ID de cuenta (32 caracteres); se ignora"
          K=$(printf '%s' "$ANTHROPIC_KEY" | tr -d '[:space:]'); [ -n "$K" ] && echo "::add-mask::$K"
          { echo "CLOUDFLARE_API_TOKEN=$T"; echo "CLOUDFLARE_ACCOUNT_ID=$A"; echo "ANTHROPIC_KEY=$K"; } >> "$GITHUB_ENV"
          CLOUDFLARE_API_TOKEN=$T
          echo "Longitud del token: ${#T} caracteres (uno correcto suele tener 40)"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en GitHub (Settings > Secrets and variables > Actions)"; exit 1
          fi
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && unset CLOUDFLARE_ACCOUNT_ID || true
          npm i -g wrangler@4 >/dev/null 2>&1
          wrangler --version
      - name: Crear/buscar almacén de límites (KV)
        id: kv
        run: |
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && unset CLOUDFLARE_ACCOUNT_ID
          mkdir -p /tmp/kv && cd /tmp/kv
          find_id() {
            wrangler kv namespace list 2>/dev/null | node -e '
              let s=require("fs").readFileSync(0,"utf8"); const a=s.indexOf("["), b=s.lastIndexOf("]");
              if(a<0||b<0) process.exit(0);
              const n=JSON.parse(s.slice(a,b+1)).find(x=>/busta-limits$/.test(x.title)); if(n) console.log(n.id);'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then wrangler kv namespace create busta-limits || true; ID=$(find_id); fi
          if [ -z "$ID" ]; then echo "::error::No se pudo crear el KV (revisa que el token tenga permiso 'Workers KV Storage: Edit')"; exit 1; fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Publicar Worker
        working-directory: busta-paga/server
        run: |
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && unset CLOUDFLARE_ACCOUNT_ID
          cat > wrangler.toml <<EOF
          name = "busta-chiara"
          main = "worker.js"
          compatibility_date = "2025-06-01"
          workers_dev = true
          keep_vars = true

          [[kv_namespaces]]
          binding = "LIMITS"
          id = "${{ steps.kv.outputs.id }}"
          EOF
          wrangler deploy
          if [ -n "$ANTHROPIC_KEY" ]; then
            printf '%s' "$ANTHROPIC_KEY" | wrangler secret put ANTHROPIC_API_KEY
          else
            echo "::warning::No hay secreto ANTHROPIC_API_KEY en GitHub: la IA queda apagada hasta que lo añadas"
          fi
      - name: Comprobar
        run: |
          sleep 8
          curl -s -H "Origin: https://pronfutray.github.io" https://busta-chiara.raul-ronaldinio1.workers.dev/ || true
