name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['gps/**', '.github/workflows/build-gps-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        run: npm install

      - name: Copiar el juego a www/
        run: |
          mkdir -p www
          cp index.html game.js manifest.json sw.js icon-192.png icon-512.png www/

      - name: Crear proyecto Android
        run: |
          npx cap add android
          # forzar orientación horizontal
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compilar APK (debug, instalable directamente)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DragonShot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DragonShot-apk
          path: DragonShot.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Dragon Shot v1.${{ github.run_number }}
          body: Descarga **DragonShot.apk** en tu Android e instálalo (permite "instalar apps desconocidas" si te lo pide).
          files: DragonShot.apk
          make_latest: true
