name: Build Busta Chiara APK

on:
  push:
    branches: [main]
    paths: ['busta-paga/**', '.github/workflows/build-busta-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: busta-paga
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Firma fija (para que las actualizaciones se instalen encima)
        run: mkdir -p $HOME/.android && cp $GITHUB_WORKSPACE/android-signing/debug.keystore $HOME/.android/debug.keystore

      - name: Instalar Capacitor
        run: npm install

      - name: Preparar www/ con la app
        run: |
          mkdir -p www/vendor/core www/vendor/lang
          cp index.html app.js parser.js sample.js config.js money.js manifest.json icon-192.png icon-512.png www/
          cp -r vendor/* www/vendor/

      - name: Librerías offline PDF y OCR (opcional)
        continue-on-error: true
        run: |
          mkdir -p /tmp/libs && cd /tmp/libs && npm init -y >/dev/null
          npm install pdfjs-dist@3.11.174 tesseract.js@5.1.1 || echo "AVISO: no se pudieron instalar pdfjs/tesseract"
          npm install @tesseract.js-data/ita || echo "AVISO: sin datos de idioma local"
          cd - >/dev/null
          N=/tmp/libs/node_modules
          cp $N/tesseract.js/dist/tesseract.min.js $N/tesseract.js/dist/worker.min.js www/vendor/ || echo "AVISO: tesseract"
          cp $N/tesseract.js-core/*.js www/vendor/core/ || echo "AVISO: core"
          cp $N/tesseract.js-core/*.wasm www/vendor/core/ 2>/dev/null || true
          IT=$(find $N/@tesseract.js-data/ita -name 'ita.traineddata.gz' 2>/dev/null | grep best_int | head -1)
          [ -n "$IT" ] || IT=$(find $N/@tesseract.js-data/ita -name 'ita.traineddata.gz' 2>/dev/null | head -1)
          if [ -n "$IT" ]; then cp "$IT" www/vendor/lang/ita.traineddata.gz; else echo "AVISO: sin ita.traineddata.gz (la app lo descargará online)"; fi
          du -sh www; ls www/vendor www/vendor/core www/vendor/lang || true

      - name: Crear proyecto Android con permiso de cámara e icono
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${s%%:*}; px=${s##*:}
            mkdir -p $R/mipmap-$d
            ( magick icon-512.png -resize ${px}x${px} $R/mipmap-$d/ic_launcher.png \
              || convert icon-512.png -resize ${px}x${px} $R/mipmap-$d/ic_launcher.png ) 2>/dev/null \
              || cp icon-512.png $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_foreground.png
          done
          grep -c "android.permission.CAMERA" "$M"
          npx cap sync android

      - name: Compilar APK
        working-directory: busta-paga/android
        run: ./gradlew assembleDebug

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk BustaChiara.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BustaChiara-apk
          path: busta-paga/BustaChiara.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: busta-v1.${{ github.run_number }}
          name: Busta Chiara v1.${{ github.run_number }}
          body: Descarga **BustaChiara.apk**, instálalo en tu Android (acepta "instalar apps desconocidas") y concede el permiso de cámara si quieres hacer fotos a la busta paga.
          files: busta-paga/BustaChiara.apk
          make_latest: false
