name: Build NavPro GPS APK

on:
  push:
    branches: [main]
    paths: ['gps/**', '.github/workflows/build-gps-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        run: npm install

      - name: Copiar la app a www/
        run: |
          mkdir -p www
          cp index.html app.js nav.js manifest.json sw.js icon-192.png icon-512.png www/

      - name: Crear proyecto Android con permisos de ubicación
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$M"
          sed -i 's/<activity /<activity android:screenOrientation="unspecified" /' "$M"
          grep -c ACCESS_FINE_LOCATION "$M"
          npx cap sync android

      - name: Compilar APK
        working-directory: gps/android
        run: ./gradlew assembleDebug

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk NavProGPS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NavProGPS-apk
          path: gps/NavProGPS.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gps-v1.${{ github.run_number }}
          name: NavPro GPS v1.${{ github.run_number }}
          body: Descarga **NavProGPS.apk**, instálalo en tu Android y acepta el permiso de ubicación.
          files: gps/NavProGPS.apk
          make_latest: false
