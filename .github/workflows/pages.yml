name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Preparar la web y subir el paquete (en un trabajo aparte, así el paquete
  #    queda guardado del todo antes de publicarlo)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio
        run: |
          mkdir _site
          cp index.html game.js manifest.json sw.js icon-192.png icon-512.png _site/
          mkdir -p _site/gps
          cp gps/index.html gps/app.js gps/nav.js gps/manifest.json gps/sw.js gps/icon-192.png gps/icon-512.png _site/gps/
          mkdir -p _site/gpl-calc
          cp gpl-calc/index.html _site/gpl-calc/
          mkdir -p _site/gpl-calc-it
          cp gpl-calc-it/index.html gpl-calc-it/manifest.webmanifest _site/gpl-calc-it/
          cp gpl-calc/manifest.webmanifest _site/gpl-calc/
          cp -r gpl-icons _site/gpl-icons
          mkdir -p _site/busta-paga
          cp busta-paga/index.html busta-paga/app.js busta-paga/parser.js busta-paga/sample.js busta-paga/config.js busta-paga/money.js busta-paga/manifest.json busta-paga/icon-192.png busta-paga/icon-512.png _site/busta-paga/
          cp -r busta-paga/vendor _site/busta-paga/
          sed -i "s/\.js?v=[0-9]*/.js?v=${GITHUB_SHA::8}/g" _site/busta-paga/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 2) Publicar (con un reintento automático si GitHub falla la primera vez)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar antes de reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
