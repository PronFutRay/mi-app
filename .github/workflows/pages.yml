name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio
        run: |
          mkdir _site
          cp index.html game.js manifest.json sw.js icon-192.png icon-512.png _site/
          mkdir -p _site/gps
          cp gps/index.html gps/app.js gps/nav.js gps/manifest.json gps/sw.js gps/icon-192.png gps/icon-512.png _site/gps/
          mkdir -p _site/gpl-calc
          cp gpl-calc/index.html _site/gpl-calc/
          mkdir -p _site/gpl-calc-it
          cp gpl-calc-it/index.html _site/gpl-calc-it/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
